<h1>履修ガチ勢</h1><p class="history-subtitle">診断履歴</p>

</header>


<div class="container">

<button
    class="btn blue"
    onclick="location.href='index.html'"
>
    ホームへ戻る
</button>


<button
    class="btn green"
    onclick="location.href='anke-to.html'"
>
    診断を開く
</button>


<button
    class="btn red"
    onclick="clearHistory()"
>
    履歴をすべて削除
</button>


<div class="card">

    <div class="title">
        最新の診断結果
    </div>

    <div id="latest"></div>

</div>


<div id="historyArea"></div>

</div>


<script>

/* =========================
   データ取得
========================= */

let history =
    JSON.parse(
        localStorage.getItem("history")
    ) || [];


/*
最新結果は
latestRankingを直接信用せず、
履歴の最新データから取得する。

これによって
古いlatestRankingが残っていても
表示されなくなる。
*/
function getLatestRanking(){

    if(history.length === 0){
        return [];
    }

    const last =
        history[history.length - 1];

    return (
        last.rankingByTab?.job ||
        last.ranking ||
        []
    );

}


let latest = getLatestRanking();



/* =========================
   最新診断結果
========================= */

function renderLatest(){

    const area =
        document.getElementById("latest");


    /*
    履歴そのものが無ければ
    必ず「該当なし」
    */
    if(
        history.length === 0 ||
        !latest ||
        latest.length === 0
    ){

        area.innerHTML = `
            <div class="small">
                該当なし
            </div>
        `;

        return;

    }


    area.innerHTML =
        latest
        .slice(0,5)
        .map(
            (item,i)=>`

            <div class="small">

                ${i + 1}位：
                ${item.name}
                （適合率 ${item.rate}%）

            </div>

            `
        )
        .join("");

}



/* =========================
   履歴一覧
========================= */

function renderHistory(){

    const area =
        document.getElementById(
            "historyArea"
        );

    area.innerHTML = "";


    if(history.length === 0){

        area.innerHTML = `

            <div class="card">

                <div class="title">
                    まだ履歴がありません
                </div>

                <div class="small">
                    診断を実行するとここに表示されます
                </div>

            </div>

        `;

        return;

    }


    const reversed =
        [...history].reverse();


    reversed.forEach(
        (item,index)=>{

        const originalIndex =
            history.length - 1 - index;

        const ranking =
            item.rankingByTab?.job ||
            item.ranking ||
            [];


        area.innerHTML += `

            <div class="card">

                <div class="title">

                    診断
                    ${history.length - index}

                </div>


                <div class="small">

                    日時：
                    ${item.date || "不明"}

                </div>


                <div class="small">

                    表示時期：

                    ${
                        (item.periods || [])
                        .join("、")
                        ||
                        "なし"
                    }

                </div>


                <div class="small">

                    選択職種：

                    ${
                        (item.selectedJobs || [])
                        .join("、")
                        ||
                        "なし"
                    }

                </div>


                <div class="small">

                    選択講義数：

                    ${
                        (item.subjects || [])
                        .length
                    }

                </div>


                <div class="small">

                    取得済み講義：

                    ${
                        (item.subjects || [])
                        .join("、")
                        ||
                        "なし"
                    }

                </div>


                <button

                    id="historyBtn${originalIndex}"

                    class="detailBtn"

                    onclick="
                        toggleHistoryDetail(
                            ${originalIndex}
                        )
                    "
                >

                    詳細を見る

                </button>


                <div

                    id="historyDetail${originalIndex}"

                    class="detailBox"

                >

                    ${
                        ranking.length === 0

                        ?

                        `
                        <div class="small">

                            ランキング詳細は
                            まだありません。

                        </div>
                        `

                        :

                        ranking
                        .map(
                            (r,i)=>`

                            <div class="small">

                                ${i + 1}位：
                                ${r.name}
                                （適合率 ${r.rate}%）

                            </div>

                            `
                        )
                        .join("")
                    }

                </div>


                <div class="actionArea">

                    <button

                        class="orange"

                        onclick="
                            editHistory(
                                ${originalIndex}
                            )
                        "
                    >

                        変更

                    </button>


                    <button

                        class="red"

                        onclick="
                            deleteHistory(
                                ${originalIndex}
                            )
                        "
                    >

                        削除

                    </button>

                </div>

            </div>

        `;

    });

}



/* =========================
   詳細開閉
========================= */

function toggleHistoryDetail(index){

    const box =
        document.getElementById(
            "historyDetail" + index
        );

    const btn =
        document.getElementById(
            "historyBtn" + index
        );


    if(
        box.style.display === "block"
    ){

        box.style.display = "none";

        btn.textContent =
            "詳細を見る";

    }else{

        box.style.display = "block";

        btn.textContent =
            "閉じる";

    }

}



/* =========================
   履歴変更
========================= */

function editHistory(index){

    const item =
        history[index];


    if(!item){
        return;
    }


    localStorage.setItem(
        "editHistoryIndex",
        String(index)
    );


    /*
    編集画面用として
    選択内容を保存
    */
    localStorage.setItem(
        "selectedLectures",
        JSON.stringify(
            item.subjects || []
        )
    );


    localStorage.setItem(
        "selectedJobs",
        JSON.stringify(
            item.selectedJobs || []
        )
    );


    localStorage.setItem(
        "selectedPeriods",
        JSON.stringify(
            item.periods || []
        )
    );


    localStorage.setItem(
        "undecided",
        item.undecided
        ? "true"
        : "false"
    );


    location.href =
        "anke-to.html";

}



/* =========================
   1件削除
========================= */

function deleteHistory(index){

    if(
        !confirm(
            "この診断履歴を削除しますか？"
        )
    ){
        return;
    }


    history.splice(
        index,
        1
    );


    /*
    0件になった場合
    */
    if(history.length === 0){

        clearDiagnosisStorage();

        history = [];
        latest = [];

    }

    /*
    まだ履歴がある場合
    */
    else{

        localStorage.setItem(
            "history",
            JSON.stringify(history)
        );


        /*
        一番新しい履歴を
        最新診断として設定
        */
        const last =
            history[
                history.length - 1
            ];


        latest =
            last.rankingByTab?.job ||
            last.ranking ||
            [];


        localStorage.setItem(
            "latestRanking",
            JSON.stringify(latest)
        );


        localStorage.setItem(
            "selectedLectures",
            JSON.stringify(
                last.subjects || []
            )
        );


        localStorage.setItem(
            "selectedJobs",
            JSON.stringify(
                last.selectedJobs || []
            )
        );


        localStorage.setItem(
            "selectedPeriods",
            JSON.stringify(
                last.periods || []
            )
        );


        localStorage.setItem(
            "undecided",
            last.undecided
            ? "true"
            : "false"
        );


        /*
        学期比較チェック状態をリセット。

        削除した履歴を参照した
        チャートが残るのを防止。
        */
        localStorage.removeItem(
            "homeDisplayState"
        );


        /*
        履修候補も一度リセット
        */
        localStorage.removeItem(
            "lectureCandidates"
        );


        localStorage.removeItem(
            "editHistoryIndex"
        );

    }


    renderLatest();

    renderHistory();

}



/* =========================
   診断関連データ完全削除
========================= */

function clearDiagnosisStorage(){

    /*
    診断履歴
    */
    localStorage.removeItem(
        "history"
    );


    /*
    最新ランキング
    */
    localStorage.removeItem(
        "latestRanking"
    );


    /*
    最新診断の選択内容
    */
    localStorage.removeItem(
        "selectedLectures"
    );

    localStorage.removeItem(
        "selectedJobs"
    );

    localStorage.removeItem(
        "selectedPeriods"
    );

    localStorage.removeItem(
        "undecided"
    );


    /*
    履修候補
    */
    localStorage.removeItem(
        "lectureCandidates"
    );


    /*
    履歴編集中の情報
    */
    localStorage.removeItem(
        "editHistoryIndex"
    );


    /*
    ★重要

    ホーム画面の

    ・チェックしていた学期
    ・表示していたタブ

    などもリセットする。

    これが残っていると
    全履歴削除後にも
    古いチャート状態が
    復元される可能性がある。
    */
    localStorage.removeItem(
        "homeDisplayState"
    );

}



/* =========================
   全履歴削除
========================= */

function clearHistory(){

    if(
        !confirm(
            "本当に履歴をすべて削除しますか？"
        )
    ){
        return;
    }


    /*
    診断に関係するデータを
    全部削除
    */
    clearDiagnosisStorage();


    /*
    JavaScript上のデータも
    空にする
    */
    history = [];

    latest = [];


    /*
    画面を即座に更新
    */
    renderLatest();

    renderHistory();


    alert(
        "履歴を削除しました"
    );

}



/* =========================
   初期表示
========================= */

renderLatest();

renderHistory();

</script>
