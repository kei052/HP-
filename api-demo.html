<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>API接続テスト | 履修ガチ勢</title>
<style>
body{margin:0;background:#f2f7fb;color:#173851;font-family:system-ui,sans-serif}header{background:#1768aa;color:white;padding:1rem 1.5rem}main{max-width:960px;margin:auto;padding:1rem}section{background:white;border:1px solid #d3e2ed;border-radius:14px;padding:1.2rem;margin:1rem 0}button{background:#1768aa;color:white;border:0;border-radius:8px;padding:.65rem 1rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#075b9d}label{display:block;padding:.4rem 0}select{padding:.5rem;max-width:100%}table{border-collapse:collapse;width:100%;margin-top:.7rem}th,td{border-bottom:1px solid #d3e2ed;text-align:left;padding:.5rem}.error{color:#a11}small{color:#4b657a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
</style>
</head>
<body><header><h1>API接続テスト</h1><p>講義・職業・資格の確認</p></header><main>
<p><a href="index.html">ホームに戻る</a></p>
<p id="status" role="status">APIに接続しています…</p>
<section><h2>講義を選ぶ</h2><p>履修済み講義と、追加したい講義を選択してください。同じ講義は一度だけ計算されます。</p><div class="grid"><div><h3>履修済み</h3><div id="completed"></div></div><div><h3>履修候補</h3><div id="candidate"></div></div></div><button id="diagnose" disabled>適合率を計算</button></section>
<section><h2>診断結果</h2><div id="results">講義を選んで「適合率を計算」を押してください。</div></section>
<section><h2>職業と関連情報</h2><label for="jobs">職業を選択</label><select id="jobs" disabled></select><div id="job-detail"></div></section>
<section><h2>資格と関連情報</h2><label for="qualifications">資格を選択</label><select id="qualifications" disabled></select><div id="qualification-detail"></div></section>
</main><script src="js/api-demo.js"></script></body></html>
