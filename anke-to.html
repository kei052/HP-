<script>

/* =========================================

const subjects = [

"診療情報管理論Ⅰ",
"診療情報管理論Ⅱ",

"医療管理各論",

"国際統計分類I",
"国際統計分類Ⅱ",

"健康ビッグデータ",

"デジタルヘルスコミュニケーション",
"デジタルヘルステクノロジー",
"デジタルヘルスイノベーション",

"医療統計学",

"社会心理学",

"観光行動論",

"マーケティング論",
"地域マーケティング論",
"市場調査論",

"簿記原理",
"会計学原理",

"経営分析論",
"経営戦略論",
"経営統計学"

];


/* =========================================
   職種一覧
========================================= */

const jobs = [

"診療情報管理士",

"教職",

"プログラマ",

"システムエンジニア",

"Webデザイン",

"データサイエンティスト",

"AI開発者",

"ネットワーク管理者",

"セキュリティアナリスト",

"ITコンサルタント",

"ITサポート・ヘルプデスク"

];


/* =========================================
   起動
========================================= */

window.onload = function(){

    renderCheckboxes();

    restoreAnswers();

};


/* =========================================
   チェックボックス生成
========================================= */

function renderCheckboxes(){

    document
    .getElementById(
        "subjectArea"
    )
    .innerHTML =

        subjects
        .map(
            subject => `

            <label>

                <input
                    type="checkbox"
                    class="subject"
                    value="${subject}"
                >

                ${subject}

            </label>

            `
        )
        .join("");


    document
    .getElementById(
        "jobArea"
    )
    .innerHTML =

        jobs
        .map(
            job => `

            <label>

                <input
                    type="checkbox"
                    class="job"
                    value="${job}"
                >

                ${job}

            </label>

            `
        )
        .join("");

}


/* =========================================
   「特に決まっていない」
========================================= */

function toggleUndecided(){

    const undecided =
        document.getElementById(
            "undecided"
        );


    const jobCheckboxes =
        document.querySelectorAll(
            ".job"
        );


    jobCheckboxes.forEach(
        job => {

            job.disabled =
                undecided.checked;


            if(undecided.checked){

                job.checked =
                    false;

            }

        }
    );

}


/* =========================================
   履歴取得
========================================= */

function getHistory(){

    try{

        const history =
            JSON.parse(
                localStorage.getItem(
                    "history"
                )
            );


        return Array.isArray(history)
            ? history
            : [];

    }catch(e){

        return [];

    }

}


/* =========================================
   学期順
========================================= */

const periodOrder = {

    "1年前期":1,
    "1年後期":2,

    "2年前期":3,
    "2年後期":4,

    "3年前期":5,
    "3年後期":6,

    "4年前期":7,
    "4年後期":8

};


/* =========================================
   履歴の学期取得
========================================= */

function getHistoryPeriod(item){

    if(!item){
        return "";
    }


    if(
        Array.isArray(
            item.periods
        ) &&
        item.periods.length > 0
    ){

        return item.periods[0];

    }


    if(
        typeof item.period ===
        "string"
    ){

        return item.period;

    }


    if(
        Array.isArray(
            item.selectedPeriods
        ) &&
        item.selectedPeriods.length > 0
    ){

        return item
        .selectedPeriods[0];

    }


    return "";

}


/* =========================================
   最新学期の履歴
========================================= */

function getNewestAcademicHistoryIndex(){

    const history =
        getHistory();


    if(history.length === 0){
        return -1;
    }


    let newestIndex = -1;

    let newestOrder = -1;


    history.forEach(
        (item,index) => {

            const period =
                getHistoryPeriod(
                    item
                );


            const order =
                periodOrder[
                    period
                ];


            if(
                typeof order !==
                "number"
            ){
                return;
            }


            if(
                order > newestOrder ||
                (
                    order === newestOrder &&
                    index > newestIndex
                )
            ){

                newestOrder =
                    order;

                newestIndex =
                    index;

            }

        }
    );


    /*
    学期が入っていない
    古いデータへの対応
    */
    if(newestIndex === -1){

        return (
            history.length - 1
        );

    }


    return newestIndex;

}


/* =========================================
   回答復元

   ★今回の重要部分
========================================= */

function restoreAnswers(){

    const history =
        getHistory();


    const editIndexRaw =
        localStorage.getItem(
            "editHistoryIndex"
        );


    /*
    最初は全部空
    */
    let savedSubjects = [];

    let savedJobs = [];

    let savedPeriods = [];

    let undecided = false;


    /*
    =====================================
    履歴を「変更」して開いた場合

    → 指定された履歴だけを読み込む
    =====================================
    */

    if(editIndexRaw !== null){

        const editIndex =
            Number(
                editIndexRaw
            );


        if(
            Number.isInteger(
                editIndex
            ) &&
            history[editIndex]
        ){

            const item =
                history[
                    editIndex
                ];


            savedSubjects =
                item.subjects || [];


            savedJobs =
                item.selectedJobs || [];


            savedPeriods =
                item.periods || [];


            undecided =
                item.undecided ||
                false;

        }else{

            /*
            編集対象が存在しない場合
            古いeditHistoryIndexを削除
            */
            localStorage.removeItem(
                "editHistoryIndex"
            );

        }

    }


    /*
    =====================================
    通常の「診断する」から開いた場合

    履歴がある場合だけ
    最新の正式診断を読み込む
    =====================================
    */

    else if(history.length > 0){

        const newestIndex =
            getNewestAcademicHistoryIndex();


        const latest =
            history[
                newestIndex
            ];


        if(latest){

            savedSubjects =
                latest.subjects || [];


            savedJobs =
                latest.selectedJobs || [];


            savedPeriods =
                latest.periods || [];


            undecided =
                latest.undecided ||
                false;

        }

    }


    /*
    =====================================
    履歴0件の場合

    savedSubjects
    savedJobs
    savedPeriods

    は空のまま。

    selectedLecturesなどの
    古いlocalStorageは使用しない。
    =====================================
    */


    document
    .querySelectorAll(
        ".subject"
    )
    .forEach(
        subject => {

            subject.checked =
                savedSubjects.includes(
                    subject.value
                );

        }
    );


    document
    .querySelectorAll(
        ".job"
    )
    .forEach(
        job => {

            job.checked =
                savedJobs.includes(
                    job.value
                );

        }
    );


    document
    .querySelectorAll(
        ".period"
    )
    .forEach(
        period => {

            period.checked =
                savedPeriods.includes(
                    period.value
                );

        }
    );


    document
    .getElementById(
        "undecided"
    )
    .checked =
        undecided;


    toggleUndecided();

}


/* =========================================
   診断開始
========================================= */

function startDiagnosis(){

    const selectedSubjects = [];

    const selectedJobs = [];

    const selectedPeriods = [];


    /*
    取得済み講義
    */
    document
    .querySelectorAll(
        ".subject:checked"
    )
    .forEach(
        subject => {

            selectedSubjects.push(
                subject.value
            );

        }
    );


    /*
    興味職種
    */
    document
    .querySelectorAll(
        ".job:checked"
    )
    .forEach(
        job => {

            selectedJobs.push(
                job.value
            );

        }
    );


    /*
    学期
    */
    document
    .querySelectorAll(
        ".period:checked"
    )
    .forEach(
        period => {

            selectedPeriods.push(
                period.value
            );

        }
    );


    const undecided =
        document
        .getElementById(
            "undecided"
        )
        .checked;


    /*
    =====================================
    入力確認
    =====================================
    */

    if(selectedPeriods.length === 0){

        alert(
            "表示する時期を選択してください。"
        );

        return;

    }


    /*
    学期は1つだけにする。

    履歴比較を安定させるため、
    複数学期を同じ診断に入れない。
    */
    if(selectedPeriods.length > 1){

        alert(
            "表示する時期は1つだけ選択してください。"
        );

        return;

    }


    /*
    =====================================
    正式診断用データ
    =====================================
    */

    localStorage.setItem(
        "selectedLectures",
        JSON.stringify(
            selectedSubjects
        )
    );


    localStorage.setItem(
        "selectedJobs",
        JSON.stringify(
            selectedJobs
        )
    );


    localStorage.setItem(
        "selectedPeriods",
        JSON.stringify(
            selectedPeriods
        )
    );


    localStorage.setItem(
        "undecided",
        undecided
        ? "true"
        : "false"
    );


    /*
    =====================================
    履修候補をリセット

    新しい正式診断をしたら、
    前回のシミュレーション候補は
    引き継がない。
    =====================================
    */

    localStorage.removeItem(
        "lectureCandidates"
    );


    /*
    =====================================
    チャート比較状態もリセット

    新しい診断後に
    前の学期チェックが残って
    チャートが乱れるのを防ぐ。
    =====================================
    */

    localStorage.removeItem(
        "homeDisplayState"
    );


    /*
    =====================================
    履歴
    =====================================
    */

    const history =
        getHistory();


    const editIndexRaw =
        localStorage.getItem(
            "editHistoryIndex"
        );


    const item = {

        date:
            new Date()
            .toLocaleString(),

        subjects:
            selectedSubjects,

        selectedJobs:
            selectedJobs,

        periods:
            selectedPeriods,

        /*
        index.html側で
        正式ランキングを扱えるように
        最初は空
        */
        ranking:[],

        rankingByTab:{},

        undecided:
            undecided

    };


    /*
    =====================================
    履歴変更
    =====================================
    */

    if(editIndexRaw !== null){

        const editIndex =
            Number(
                editIndexRaw
            );


        if(
            Number.isInteger(
                editIndex
            ) &&
            history[editIndex]
        ){

            history[
                editIndex
            ] = item;

        }else{

            /*
            編集対象が消えていた場合は
            新しい診断として追加
            */
            history.push(
                item
            );

        }


        localStorage.removeItem(
            "editHistoryIndex"
        );

    }


    /*
    =====================================
    新規診断
    =====================================
    */

    else{

        history.push(
            item
        );

    }


    localStorage.setItem(
        "history",
        JSON.stringify(
            history
        )
    );


    /*
    古い最新ランキングを削除。

    新しい診断なのに
    前のランキングが一瞬表示されるのを
    防止する。
    */
    localStorage.removeItem(
        "latestRanking"
    );


    alert(
        "診断完了！"
    );


    location.href =
        "index.html";

}


/* =========================================
   ホームへ戻る
========================================= */

function goHome(){

    /*
    編集中にホームへ戻った場合、
    次回診断画面を開いた時に
    編集状態が残らないようにする。
    */
    localStorage.removeItem(
        "editHistoryIndex"
    );


    location.href =
        "index.html";

}

</script>

        "load",
        function(){

            navigator
            .serviceWorker
            .register(
                "./service-worker.js"
            )
            .catch(
                function(error){

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                }
            );

        }
    );

}

</script>
