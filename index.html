<script>

/* =========================================
   基本変数
========================================= */

let jobRows = [];

let jobNames = [];

let lectureNames = [];

let licenseRows = [];

let currentTab = "job";

let candidates = [];

let currentRankingData = [];

let radarChart = null;

let activeHistoryIndex = -1;

let hasDiagnosis = false;


const HOME_STATE_KEY =
    "homeDisplayState";


const periodList = [
    "1年前期",
    "1年後期",
    "2年前期",
    "2年後期",
    "3年前期",
    "3年後期",
    "4年前期",
    "4年後期"
];


const periodOrder = {

    "1年前期":1,
    "1年後期":2,

    "2年前期":3,
    "2年後期":4,

    "3年前期":5,
    "3年後期":6,

    "4年前期":7,
    "4年後期":8

};


const allQuestionLectures = [

"情報処理論",
"システム統計論",
"プログラミング応用",
"プログラミング応用演習",

"インターネットと法",

"ネットワーク技術Ⅱ",
"ネットワークの構築と運用",

"システム開発技術（IoT）",
"ウェブデザイン",

"経営情報論",
"産業情報論",
"情報セキュリティ",

"健康情報統計Ⅱ",
"健康情報統計Ⅲ",

"健康情報数学Ⅱ",

"社会調査法",

"AIデータサイエンスⅠ",
"AIデータサイエンスⅡ",

"医療・生命情報学Ⅰ",
"医療・生命情報学Ⅱ",

"パターン認識",
"画像認識",
"自然言語処理",
"人工知能",

"臨床医学および医療用語",

"臨床医学各論Ⅰ",
"臨床医学各論Ⅱ",
"臨床医学各論Ⅲ",
"臨床医学各論Ⅳ",

"診療情報管理論Ⅰ",
"診療情報管理論Ⅱ",

"医療管理各論",

"国際統計分類I",
"国際統計分類Ⅱ",

"健康ビッグデータ",

"デジタルヘルスコミュニケーション",
"デジタルヘルステクノロジー",

"医療統計学",

"マーケティング論",
"地域マーケティング論",
"市場調査論",

"簿記原理",
"会計学原理",

"経営分析論",
"経営戦略論",
"経営統計学"

];


/* =========================================
   起動
========================================= */

window.onload =
async function(){

    loadSavedCandidates();


    document
    .getElementById("searchBox")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){
                searchLecture();
            }

        }
    );


    try{

        const jobText =
            await fetch("data.csv")
            .then(
                res => res.text()
            );


        const licenseText =
            await fetch("data1.csv")
            .then(
                res => res.text()
            );


        loadJobCSV(jobText);

        loadLicenseCSV(licenseText);


        /*
        まず履歴があるか確認
        */
        const history =
            getHistory();


        hasDiagnosis =
            history.length > 0;


        /*
        履歴がない場合
        */
        if(!hasDiagnosis){

            clearStaleDiagnosisData();

            candidates = [];

            renderPeriodCompare([]);

            updateCandidates();

            clearHomeDiagnosisDisplay();

            return;

        }


        /*
        最新学期の診断内容を
        正式データとして反映
        */
        applyNewestAcademicHistory();


        const savedHomeState =
            getHomeDisplayState();


        renderPeriodCompare(
            savedHomeState.checkedPeriods
        );


        updateCandidates();

        updateSideInfo();


        switchTab(
            savedHomeState.currentTab,
            false
        );


    }catch(e){

        document
        .getElementById("resultArea")
        .innerHTML =

        "CSVファイルを読み込めませんでした。" +
        "data.csv / data1.csv が " +
        "index.html と同じ場所にあるか確認してください。";


        console.error(e);

    }

};


window.addEventListener(
    "pagehide",
    function(){

        if(hasDiagnosis){
            saveHomeDisplayState();
        }

    }
);


window.addEventListener(
    "beforeunload",
    function(){

        if(hasDiagnosis){
            saveHomeDisplayState();
        }

    }
);


/* =========================================
   CSV
========================================= */

function parseCSV(text){

    return text
    .trim()
    .split(/\r?\n/)
    .map(
        line =>
            line
            .split(",")
            .map(
                v =>
                    v
                    .replace(
                        /^"|"$/g,
                        ""
                    )
                    .trim()
            )
    );

}


function loadJobCSV(text){

    const rows =
        parseCSV(text);


    jobNames =
        rows[0]
        .slice(1)
        .map(fixName)
        .filter(
            name =>
                name !== "未定"
        );


    jobRows =
        rows
        .slice(1)
        .map(
            row => {

                const obj = {

                    lecture:
                        fixLectureName(
                            row[0]
                        ),

                    scores:{}

                };


                rows[0]
                .slice(1)
                .forEach(
                    (job,i) => {

                        const fixedJob =
                            fixName(job);


                        if(
                            fixedJob !==
                            "未定"
                        ){

                            obj.scores[
                                fixedJob
                            ] =
                                Number(
                                    row[i+1]
                                ) || 0;

                        }

                    }
                );


                return obj;

            }
        );


    lectureNames =
        jobRows.map(
            r => r.lecture
        );

}


function loadLicenseCSV(text){

    const rows =
        parseCSV(text);


    licenseRows =
        rows
        .slice(1)
        .map(
            row => ({

                job:
                    fixName(
                        row[0] || ""
                    ),

                license:
                    (
                        row[1] || ""
                    ).trim(),

                lecture:
                    fixLectureName(
                        row[2] || ""
                    )

            })
        )
        .filter(
            r =>
                r.license !== "" &&
                r.lecture !== ""
        );

}


/* =========================================
   名称統一
========================================= */

const normalize = {

    "Webデザイナ":
        "Webデザイン",

    "Webエンジニア":
        "Webデザイン",

    "AIエンジニア":
        "AI開発者",

    "ネットワークエンジニア":
        "ネットワーク管理者",

    "教職員":
        "教職",

    "ITサポート、ヘルプデスク":
        "ITサポート・ヘルプデスク"

};


function fixName(name){

    return normalize[name] || name;

}


const lectureNormalize = {

    "情報セキュリティー":
        "情報セキュリティ",

    "国際統計分類I":
        "国際統計分類Ⅰ"

};


function fixLectureName(name){

    return (
        lectureNormalize[name] ||
        name
    );

}


/* =========================================
   履歴取得
========================================= */

function getHistory(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    "history"
                )
            );


        return Array.isArray(data)
            ? data
            : [];

    }catch(e){

        return [];

    }

}


/* =========================================
   正式な履修済み講義
========================================= */

function getBaseSelectedLectures(){

    const history =
        getHistory();


    if(history.length === 0){
        return [];
    }


    const index =
        getNewestAcademicHistoryIndex();


    if(
        index < 0 ||
        !history[index]
    ){
        return [];
    }


    return [
        ...new Set(
            (
                history[index].subjects ||
                []
            )
            .map(fixLectureName)
        )
    ];

}


/* =========================================
   履修候補込み講義
========================================= */

function getSimulationLectures(){

    const base =
        getBaseSelectedLectures();


    const candidateNames =
        candidates.map(
            c =>
                fixLectureName(
                    c.name
                )
        );


    return [
        ...new Set([
            ...base,
            ...candidateNames
        ])
    ];

}


/* =========================================
   正式な選択職種
========================================= */

function getSelectedJobs(){

    const history =
        getHistory();


    if(history.length === 0){
        return [];
    }


    const index =
        getNewestAcademicHistoryIndex();


    if(
        index < 0 ||
        !history[index]
    ){
        return [];
    }


    return (
        history[index]
        .selectedJobs ||
        []
    )
    .map(fixName);

}


/* =========================================
   正式な学期
========================================= */

function getSelectedPeriods(){

    const history =
        getHistory();


    if(history.length === 0){
        return [];
    }


    const index =
        getNewestAcademicHistoryIndex();


    if(
        index < 0 ||
        !history[index]
    ){
        return [];
    }


    const item =
        history[index];


    if(
        Array.isArray(item.periods)
    ){
        return item.periods;
    }


    if(item.period){
        return [item.period];
    }


    return [];

}


/* =========================================
   ホーム状態
========================================= */

function getHomeDisplayState(){

    const fallback = {

        checkedPeriods:[],

        currentTab:"job"

    };


    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    HOME_STATE_KEY
                )
            );


        if(
            !saved ||
            typeof saved !== "object"
        ){

            return fallback;

        }


        return {

            checkedPeriods:
                Array.isArray(
                    saved.checkedPeriods
                )

                ?

                saved
                .checkedPeriods
                .filter(
                    period =>
                        periodList.includes(
                            period
                        )
                )

                :

                [],


            currentTab:
                saved.currentTab ===
                "license"

                ?

                "license"

                :

                "job"

        };


    }catch(e){

        return fallback;

    }

}


function saveHomeDisplayState(){

    if(!hasDiagnosis){
        return;
    }


    const state = {

        checkedPeriods:
            getCheckedPeriods(),

        currentTab:
            currentTab ===
            "license"

            ?

            "license"

            :

            "job"

    };


    localStorage.setItem(
        HOME_STATE_KEY,
        JSON.stringify(state)
    );

}


function goToPage(page){

    if(hasDiagnosis){
        saveHomeDisplayState();
    }


    location.href = page;

}


/* =========================================
   履歴の学期取得
========================================= */

function getHistoryPeriod(item){

    if(!item){
        return "";
    }


    if(
        Array.isArray(
            item.periods
        ) &&
        item.periods.length > 0
    ){

        return item.periods[0];

    }


    if(
        typeof item.period ===
        "string"
    ){

        return item.period;

    }


    if(
        Array.isArray(
            item.selectedPeriods
        ) &&
        item.selectedPeriods.length > 0
    ){

        return item
        .selectedPeriods[0];

    }


    return "";

}


/* =========================================
   最新学期の履歴
========================================= */

function getNewestAcademicHistoryIndex(){

    const history =
        getHistory();


    if(history.length === 0){
        return -1;
    }


    let newestIndex = -1;

    let newestOrder = -1;


    history.forEach(
        (item,index) => {

            const period =
                getHistoryPeriod(item);


            const order =
                periodOrder[period];


            if(
                typeof order !==
                "number"
            ){
                return;
            }


            if(
                order > newestOrder ||
                (
                    order === newestOrder &&
                    index > newestIndex
                )
            ){

                newestOrder =
                    order;

                newestIndex =
                    index;

            }

        }
    );


    /*
    学期情報がない古い履歴にも対応
    */
    if(newestIndex === -1){

        return (
            history.length - 1
        );

    }


    return newestIndex;

}


/* =========================================
   最新正式診断を反映
========================================= */

function applyNewestAcademicHistory(){

    const history =
        getHistory();


    const index =
        getNewestAcademicHistoryIndex();


    if(
        index < 0 ||
        !history[index]
    ){

        hasDiagnosis = false;

        clearStaleDiagnosisData();

        return;

    }


    activeHistoryIndex =
        index;


    const newest =
        history[index];


    const newestPeriod =
        getHistoryPeriod(newest);


    localStorage.setItem(
        "selectedLectures",
        JSON.stringify(
            newest.subjects || []
        )
    );


    localStorage.setItem(
        "selectedJobs",
        JSON.stringify(
            newest.selectedJobs || []
        )
    );


    localStorage.setItem(
        "selectedPeriods",
        JSON.stringify(
            newestPeriod
            ? [newestPeriod]
            : []
        )
    );


    localStorage.setItem(
        "undecided",
        newest.undecided
        ? "true"
        : "false"
    );


    /*
    最新ランキングは
    正式履歴に保存されている
    ランキングのみ使用
    */
    const savedRanking =

        newest
        .rankingByTab
        ?.job

        ||

        newest.ranking

        ||

        [];


    localStorage.setItem(
        "latestRanking",
        JSON.stringify(
            savedRanking
        )
    );

}


/* =========================================
   古い診断データ削除
========================================= */

function clearStaleDiagnosisData(){

    localStorage.removeItem(
        "latestRanking"
    );

    localStorage.removeItem(
        "selectedLectures"
    );

    localStorage.removeItem(
        "selectedJobs"
    );

    localStorage.removeItem(
        "selectedPeriods"
    );

    localStorage.removeItem(
        "undecided"
    );

    localStorage.removeItem(
        "lectureCandidates"
    );

    localStorage.removeItem(

/* =========================================
   職種適合率
========================================= */

function calcJobRateWithLectures(
    job,
    selected
){

    const total =
        jobRows.reduce(
            (sum,row) =>
                sum +
                row.scores[job],
            0
        );


    if(total === 0){
        return 0;
    }


    /*
    講義が0件なら0%
    シミュレーション表示なので
    不自然な初期値を出さない
    */
    if(selected.length === 0){
        return 0;
    }


    const got =
        jobRows
        .filter(
            row =>
                selected.includes(
                    row.lecture
                )
        )
        .reduce(
            (sum,row) =>
                sum +
                row.scores[job],
            0
        );


    return Math.round(
        (
            got /
            total
        ) * 100
    );

}


/* =========================================
   正式な職種ランキング
========================================= */

function getOfficialJobRanking(){

    const selectedJobs =
        getSelectedJobs();


    const baseLectures =
        getBaseSelectedLectures();


    let data =
        jobNames.map(
            job => ({

                name:job,

                rate:
                    calcJobRateWithLectures(
                        job,
                        baseLectures
                    )

            })
        );


    if(selectedJobs.length > 0){

        const selected =
            data.filter(
                d =>
                    selectedJobs.includes(
                        d.name
                    )
            );


        const others =
            data.filter(
                d =>
                    !selectedJobs.includes(
                        d.name
                    )
            );


        data = [

            ...selected.sort(
                (a,b) =>
                    b.rate - a.rate
            ),

            ...others.sort(
                (a,b) =>
                    b.rate - a.rate
            )

        ].slice(0,5);

    }else{

        data =
            data
            .sort(
                (a,b) =>
                    b.rate - a.rate
            )
            .slice(0,5);

    }


    return data;

}

/* =========================================
   資格適合率
========================================= */

function calcLicenseRateWithLectures(
    license,
    selected
){

    const uniqueLectures = [

        ...new Set(

            licenseRows
            .filter(
                r =>
                    r.license ===
                    license
            )
            .map(
                r => r.lecture
            )

        )

    ];


    if(uniqueLectures.length === 0){
        return 0;
    }


    if(selected.length === 0){
        return 0;
    }


    const match =
        uniqueLectures
        .filter(
            lecture =>
                selected.includes(
                    lecture
                )
        )
        .length;


    return Math.round(
        (
            match /
            uniqueLectures.length
        ) * 100
    );

}

/* =========================================
   履歴ランキング
========================================= */

function getHistoryRankingByTab(
    item,
    tab
){

    if(
        item.rankingByTab &&
        Array.isArray(
            item.rankingByTab[tab]
        )
    ){

        return item
        .rankingByTab[tab];

    }


    if(
        tab === "job" &&
        Array.isArray(item.ranking)
    ){

        return item.ranking;

    }


    /*
    古い履歴にランキングが
    保存されていない場合は
    履歴の講義からその場で計算
    */
    const lectures =
        (
            item.subjects ||
            []
        )
        .map(fixLectureName);


    if(tab === "job"){

        const selectedJobs =
            (
                item.selectedJobs ||
                []
            )
            .map(fixName);


        let data =
            jobNames.map(
                job => ({

                    name:job,

                    rate:
                        calcJobRateWithLectures(
                            job,
                            lectures
                        )

                })
            );


        if(selectedJobs.length > 0){

            const selected =
                data.filter(
                    d =>
                        selectedJobs.includes(
                            d.name
                        )
                );


            const others =
                data.filter(
                    d =>
                        !selectedJobs.includes(
                            d.name
                        )
                );


            data = [

                ...selected.sort(
                    (a,b) =>
                        b.rate - a.rate
                ),

                ...others.sort(
                    (a,b) =>
                        b.rate - a.rate
                )

            ];

        }else{

            data.sort(
                (a,b) =>
                    b.rate - a.rate
            );

        }


        return data.slice(0,5);

    }


    const licenseNames = [

        ...new Set(
            licenseRows
            .map(
                r => r.license
            )
            .filter(Boolean)
        )

    ];


    return licenseNames
    .map(
        license => ({

            name:
                license,

            rate:
                calcLicenseRateWithLectures(
                    license,
                    lectures
                )

        })
    )
    .sort(
        (a,b) =>
            b.rate - a.rate
    )
    .slice(0,5);

}

/* =========================================
   レーダーチャート

   ★履修候補は一切参照しない
========================================= */

function drawRadarChart(data){

    if(!hasDiagnosis){

        clearHomeDiagnosisDisplay();

        return;

    }


    const ctx =
        document.getElementById(
            "radarChart"
        );


    ctx.style.display =
        "block";


    document
    .getElementById(
        "noChartMessage"
    )
    .style.display =
        "none";


    if(radarChart){

        radarChart.destroy();

        radarChart = null;

    }


    const checkedPeriods =
        getCheckedPeriods();


    let labels = [];

    let datasets = [];


    const colors = [

        "rgba(0,119,255,1)",
        "rgba(231,76,60,1)",
        "rgba(46,204,113,1)",
        "rgba(243,156,18,1)",
        "rgba(155,89,182,1)",
        "rgba(26,188,156,1)",
        "rgba(52,73,94,1)",
        "rgba(255,99,132,1)"

    ];


    /*
    比較する学期が
    チェックされている場合
    */
    if(checkedPeriods.length > 0){

        const historyDatasets = [];


        checkedPeriods.forEach(
            (period,index) => {

                const histories =
                    getHistoriesByPeriod(
                        period
                    );


                histories.forEach(
                    (
                        historyItem,
                        historyIndex
                    ) => {

                        const ranking =
                            getHistoryRankingByTab(
                                historyItem,
                                currentTab
                            );


                        if(
                            !ranking ||
                            ranking.length === 0
                        ){
                            return;
                        }


                        ranking
                        .slice(0,5)
                        .forEach(
                            r => {

                                if(
                                    !labels.includes(
                                        r.name
                                    )
                                ){

                                    labels.push(
                                        r.name
                                    );

                                }

                            }
                        );


                        historyDatasets.push({

                            period:
                                period,

                            ranking:
                                ranking,

                            label:

                                histories.length > 1

                                ?

                                `${period}(${historyIndex+1})`

                                :

                                period,

                            color:

                                colors[
                                    (
                                        index +
                                        historyIndex
                                    )
                                    %
                                    colors.length
                                ]

                        });

                    }
                );

            }
        );


        historyDatasets.forEach(
            item => {

                datasets.push({

                    label:
                        item.label,

                    data:
                        labels.map(
                            label => {

                                const found =
                                    item.ranking.find(
                                        r =>
                                            r.name ===
                                            label
                                    );


                                return found
                                    ? found.rate
                                    : 0;

                            }
                        ),

                    fill:false,

                    borderColor:
                        item.color,

                    backgroundColor:
                        item.color.replace(
                            "1)",
                            "0.15)"
                        ),

                    pointRadius:4,

                    pointHoverRadius:7

                });

            }
        );

    }


    /*
    チェックした履歴がない場合は
    最新の正式診断を表示
    */
    if(datasets.length === 0){

        labels =
            data.map(
                item =>
                    item.name
            );


        datasets = [{

            label:"最新",

            data:
                data.map(
                    item =>
                        item.rate
                ),

            fill:true,

            borderColor:
                "rgba(0,119,255,1)",

            backgroundColor:
                "rgba(0,119,255,0.15)",

            pointRadius:5,

            pointHoverRadius:8

        }];

    }


    radarChart =
        new Chart(
            ctx,
            {

                type:"radar",

                data:{

                    labels:
                        labels,

                    datasets:
                        datasets

                },

                options:{

                    responsive:true,

                    plugins:{

                        legend:{
                            display:true
                        }

                    },

                    scales:{

                        r:{

                            min:0,

                            max:100,

                            ticks:{

                                stepSize:20

                            }

                        }

                    }

                }

            }
        );

}


/* =========================================
   講義検索
========================================= */

function normalizeSearchText(text){

    return text
    .toString()
    .normalize("NFKC")
    .toLowerCase()
    .replace(/Ⅰ/g,"1")
    .replace(/Ⅱ/g,"2")
    .replace(/Ⅲ/g,"3")
    .replace(/Ⅳ/g,"4")
    .replace(/ー/g,"")
    .replace(/\s/g,"");

}


function lectureSearchText(name){

    const extra = {

        "情報処理論":
            "じょうほうしょりろん",

        "システム統計論":
            "しすてむとうけいろん",

        "プログラミング応用":
            "ぷろぐらみんぐおうよう",

        "データベース演習":
            "でーたべーす",

        "データ処理入門":
            "でーたしょり",

        "情報セキュリティ":
            "じょうほうせきゅりてぃ",

        "ウェブデザイン":
            "うぇぶでざいん web",

        "人工知能":
            "じんこうちのう ai",

        "AIデータサイエンスⅠ":
            "ai えーあい でーたさいえんす",

        "AIデータサイエンスⅡ":
            "ai えーあい でーたさいえんす",

        "簿記原理":
            "ぼき",

        "会計学原理":
            "かいけい"

    };


    return normalizeSearchText(

        name +
        " " +
        (
            extra[name] ||
            ""
        )

    );

}


function searchLecture(){

    const rawKeyword =
        document
        .getElementById(
            "searchBox"
        )
        .value
        .trim();


    const keyword =
        normalizeSearchText(
            rawKeyword
        );


    const area =
        document.getElementById(
            "searchResult"
        );


    if(rawKeyword === ""){

        area.innerHTML =
            "講義名を入力してください";

        return;

    }


    const result =
        allQuestionLectures
        .map(fixLectureName)
        .filter(
            name =>
                lectureSearchText(name)
                .includes(keyword)
        );


    if(result.length === 0){

        area.innerHTML =
            "該当する講義がありません";

        return;

    }


    area.innerHTML =
        result
        .map(
            name => {

                const added =
                    candidates.some(
                        c =>
                            fixLectureName(
                                c.name
                            )
                            === name
                    );


                const alreadyTaken =
                    getBaseSelectedLectures()
                    .includes(name);


                if(alreadyTaken){

                    return `

                        <div
                            style="
                                margin-top:8px;
                            "
                        >

                            ${name}

                            <button
                                class="addedBtn"
                                disabled
                            >

                                取得済み

                            </button>

                        </div>

                    `;

                }


                return `

                    <div
                        style="
                            margin-top:8px;
                        "
                    >

                        ${name}

                        <button

                            class="${
                                added
                                ?
                                "addedBtn"
                                :
                                ""
                            }"

                            ${
                                added
                                ?
                                "disabled"
                                :
                                ""
                            }

                            onclick="
                                addCandidate(
                                    '${name}'
                                )
                            "
                        >

                            ${
                                added
                                ?
                                "追加済み"
                                :
                                "追加"
                            }

                        </button>

                    </div>

                `;

            }
        )
        .join("");

}


/* =========================================
   履修候補追加

   ★チャートには触らない
   ★履歴には触らない
   ★学期チェックにも触らない
========================================= */

function addCandidate(name){

    if(!hasDiagnosis){

        alert(
            "先に診断を行ってください。"
        );

        return;

    }


    const fixedName =
        fixLectureName(name);


    if(
        getBaseSelectedLectures()
        .includes(fixedName)
    ){

        return;

    }


    if(
        !candidates.some(
            c =>
                fixLectureName(
                    c.name
                )
                === fixedName
        )
    ){

        candidates.push({

            name:
                fixedName

        });


        saveCandidates();

        updateCandidates();


        /*
        ★重要

        switchTab()は呼ばない。

        横棒ランキングだけ
        再描画する。
        */
        renderSimulationRanking();


        /*
        検索結果の
        「追加済み」表示だけ更新
        */
        searchLecture();

    }

}


/* =========================================
   履修候補削除
========================================= */

function removeCandidate(name){

    candidates =
        candidates.filter(
            c =>
                fixLectureName(
                    c.name
                )
                !==
                fixLectureName(name)
        );


    saveCandidates();

    updateCandidates();


    /*
    横棒だけ更新
    */
    renderSimulationRanking();


    const searchBox =
        document.getElementById(
            "searchBox"
        );


    if(
        searchBox.value
        .trim() !== ""
    ){

        searchLecture();

    }

}


/* =========================================
   シミュレーションランキングだけ更新
========================================= */

function renderSimulationRanking(){

    if(!hasDiagnosis){
        return;
    }


    if(currentTab === "job"){

        renderJobs();

    }else{

        renderLicenses();

    }


    /*
    ここでは絶対に

    drawRadarChart()
    updateLatestHistoryRanking()
    saveHomeDisplayState()

    を呼ばない。
    */

}


/* =========================================
   次学期履修候補一覧
========================================= */

function updateCandidates(){

    const list =
        document.getElementById(
            "candidateList"
        );


    list.innerHTML = "";


    if(candidates.length === 0){

        list.innerHTML = `

            <li class="small">

                まだ履修候補はありません

            </li>

        `;

        return;

    }


    candidates.forEach(
        c => {

            const li =
                document.createElement(
                    "li"
                );


            li.className =
                "candidateItem";


            li.innerHTML = `

                <span>
                    ${c.name}
                </span>


                <button

                    class="deleteBtn"

                    onclick="
                        removeCandidate(
                            '${c.name}'
                        )
                    "

                >

                    ×

                </button>

            `;


            list.appendChild(li);

        }
    );

}


/* =========================================
   候補リセット
========================================= */

function clearCandidates(){

    candidates = [];


    saveCandidates();

    updateCandidates();


    /*
    横棒だけ戻す
    */
    renderSimulationRanking();


    const searchBox =
        document.getElementById(
            "searchBox"
        );


    if(
        searchBox.value
        .trim() !== ""
    ){

        searchLecture();

    }else{

        document
        .getElementById(
            "searchResult"
        )
        .innerHTML = "";

    }

}


/* =========================================
   候補保存
========================================= */

function saveCandidates(){

    localStorage.setItem(
        "lectureCandidates",
        JSON.stringify(
            candidates
        )
    );

}


/* =========================================
   候補読込
========================================= */

function loadSavedCandidates(){

    const saved =
        localStorage.getItem(
            "lectureCandidates"
        );


    if(!saved){

        candidates = [];

        return;

    }


    try{

        const parsed =
            JSON.parse(saved);


        candidates =
            Array.isArray(parsed)
            ? parsed
            : [];


    }catch(e){

        candidates = [];

    }

}
