 const history=safeHistory();const latest=history.at(-1)||{};
 const selected=latest.subjects||latest.selectedLectures||latest.lectures||latest.selectedSubjects||[];
 const current=new Set((Array.isArray(selected)?selected:[]).map(x=>key(typeof x==='string'?x:x?.name)).filter(Boolean));
 const firstPeriod=new Map();
 // Each diagnosis contains the cumulative checked set. First appearance fixes the academic term.
 for(const h of history){
  const terms=h.periods||h.selectedPeriods||[];
  const period=Array.isArray(terms)&&terms.length===1&&periods.includes(terms[0])?terms[0]:'学期未登録';
  const items=h.subjects||h.selectedLectures||h.lectures||h.selectedSubjects||[];
  for(const v of Array.isArray(items)?items:[]){const k=key(typeof v==='string'?v:v?.name);if(k&&!firstPeriod.has(k))firstPeriod.set(k,period)}
 }
 const records=[];
 for(const k of current){const c=byName.get(k);if(!c)continue;const credit=Number(c['単位数']);if(!Number.isFinite(credit)||credit<=0)continue;records.push({name:c['講義名'],period:firstPeriod.get(k)||'学期未登録',education:c['教育区分'],category:c['詳細区分']||c['科目区分'],credits:credit})}
 const unknown=[...current].filter(k=>!byName.has(k)).length;
 const sum=records.reduce((n,x)=>n+x.credits,0);
 document.getElementById('summary').textContent=`診断でチェックした講義：${current.size}科目／照合できた単位：${sum}単位`+(unknown?`／科目データ未照合 ${unknown}件`:'');
 const legend=document.getElementById('legend');periods.forEach((p,i)=>{const span=document.createElement('span'),sw=document.createElement('i');sw.className='swatch';sw.style.background=colors[i];span.append(sw,document.createTextNode(p));legend.append(span)});
 const root=document.getElementById('requirements');
 const groups=requirements.map(r=>({label:r['科目区分'],edu:r['教育区分'],minimum:Number(r['最低必要単位'])||0,unknown:r['教育区分']==='自由選択'}));
 function renderGroup(g){
  const items=g.unknown?[]:records.filter(x=>x.education===g.edu&&(g.whole||(x.category===g.label||(g.label==='沖縄理解科目'&&x.category==='沖縄理解')||(g.label==='専門総合科目'&&x.category==='専門総合演習'))));
  const taken=items.reduce((n,x)=>n+x.credits,0),min=g.minimum;
  const box=document.createElement('div');box.className='group';
  const title=document.createElement('div');title.className='group-title';const name=document.createElement('span');name.textContent=g.label;
  const count=document.createElement('small');count.textContent=g.unknown?`算入未判定 / 必要${min}単位`: `${taken} / ${min}単位以上`;
  title.append(name,count);box.append(title);
  const track=document.createElement('div');track.className='track';track.setAttribute('role','img');track.setAttribute('aria-label',g.label+' '+count.textContent);
  let remaining=min;
  for(let i=0;i<periods.length;i++){
   const n=items.filter(x=>x.period===periods[i]).reduce((v,x)=>v+x.credits,0);
   const used=Math.max(0,Math.min(remaining,n));remaining-=used;
   if(used&&min>0){const seg=document.createElement('div');seg.className='seg';seg.style.flex=`0 0 ${used/min*100}%`;seg.style.background=colors[i];seg.title=periods[i]+': '+n+'単位';track.append(seg)}
  }
  box.append(track);
  const note=[];if(taken>min)note.push(`必要数超過 ${taken-min}単位（超過分はバーに重ねません）`);
  if(note.length){const el=document.createElement('div');el.className='over';el.textContent=note.join(' / ');box.append(el)}return box
 }
 for(const edu of ['教養教育','専門教育','自由選択']){
  const section=document.createElement('div');section.className='section-title';section.textContent=edu==='教養教育'?'教養教育・科目区分別':edu==='専門教育'?'専門教育・科目区分別':'自由選択・科目区分別';root.append(section);
  for(const g of groups.filter(x=>x.edu===edu))root.append(renderGroup(g))
 }
})();
</script></body></html>
