<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ｜履修ガチ勢</title><link rel="manifest" href="manifest.webmanifest"><style>

:#58718a;font-weight:600}.track{height:21px;background:#e7eef5;display:flex;overflow:hidden;border-radius:9px}.seg{height:100%;min-width:0}.over{font-size:12px;color:#536b80;margin-top:5px}.section-title{background:#edf5fb;border-radius:9px;padding:10px 12px;margin:20px 0 8px;font-weight:800}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:540px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#edf5fb}.notice{background:#f2f6fa;border-radius:10px;padding:10px 13px;font-size:13px} @media(max-width:650px){header{padding:18px 12px 22px}header h1{font-size:23px}.topnav{grid-template-columns:repeat(3,minmax(0,1fr));padding:10px;gap:6px}.topnav a{font-size:12px;padding:10px 3px;min-height:43px}main{padding:6px 10px 20px}.card{padding:15px}.group-title{font-size:14px}.headline{font-size:21px}}
</style><link rel="stylesheet" href="rishu-enhance.css"><script defer src="rishu-account.js"></script><script defer src="rishu-catalog.js"></script><script defer src="rishu-enhance.js"></script><script defer src="rishu-mypage.js"></script></head><body><header><img class="brand" src="icons/icon-192.png" alt="履修ガチ勢ロゴ"><h1>履修ガチ勢</h1><p>マイページ</p></header><nav class="topnav" aria-label="メインメニュー"><a href="index.html">ホーム</a><a href="jobs.html">講義検索</a><a href="licenses.html">資格検索</a><a class="active" href="mypage.html">マイページ</a><a href="history.html">診断履歴</a></nav><main><section class="card"><h2>プロフィール</h2><p>表示する名前を設定できます。</p><label for="nickname">表示する名前</label><input id="nickname" maxlength="40" placeholder="ニックネーム"><button id="saveName">名前を保存</button><p id="welcome"></p></section><section class="card"><h2>卒業要件と取得単位</h2><p>科目区分ごとに、必要単位数を最大値とした積み上げバーで表示します。色は取得学期を表します。</p><div id="summary" class="headline">集計中…</div><div id="legend" class="legend"></div><div id="requirements"></div><p class="notice">※ 表の「卒業要件単位」のみをバーの基準に使用しています。「小計」は使用しません。学期別の色は初回チェック時の学期です。超過単位はバーに重ねません。自由選択科目への算入は未判定です。</p></section></main><script>
const nick=document.getElementById('nickname');nick.value=localStorage.getItem('rishuDisplayName')||'';document.getElementById('saveName').onclick=()=>{localStorage.setItem('rishuDisplayName',nick.value.trim());showName()};function showName(){document.getElementById('welcome').textContent=nick.value?'こんにちは、'+nick.value+' さん！':''}showName();

</script></body></html>
